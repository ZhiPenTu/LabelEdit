name: Validate commerce desktop
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      COMMERCE_DESKTOP_SIGNING: unsigned
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        if: runner.os == 'macOS'
        with:
          version: '0.11.6'
          enable-cache: false
      - name: Select framework-free macOS packaging Python
        if: runner.os == 'macOS'
        run: |
          uv python install 3.12.11
          COMMERCE_PACKAGING_PYTHON=$(uv python find --managed-python 3.12.11)
          echo "COMMERCE_PACKAGING_PYTHON=$COMMERCE_PACKAGING_PYTHON" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'native/sandbox -> target'
      - name: Install dependencies and prepare models
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts
          node node_modules/electron/install.js
          npm run build:harness-native
          python -m backend.ocr_service
      - name: Source checks
        run: |
          python -m pytest -q
          npm test
          npm run build
          npm run build:sandbox
      - name: Build offline RPC plugin
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            "$COMMERCE_PACKAGING_PYTHON" scripts/build_backend.py --distpath resources/generated/plugins/official.labeledit/backend
          else
            python scripts/build_backend.py --distpath resources/generated/plugins/official.labeledit/backend
          fi
      - name: Prepare and test actual sandboxed processes
        run: |
          npm run platform:prepare
          node scripts/verify-macos-runtime.mjs
          npm run test:platform
          node scripts/test-plugin-navigation.mjs
          npx playwright test --config tests/electron/playwright.config.mjs
      - name: Package Electron application (validation only)
        shell: bash
        run: |
          node scripts/package-desktop.mjs --dir
          if [[ "$RUNNER_OS" == "macOS" ]]; then node scripts/verify-macos-runtime.mjs "release/desktop/mac-arm64/Qingzuo.app"; fi
          node scripts/test-packaged-desktop.mjs
          if [[ "$RUNNER_OS" == "macOS" ]]; then node scripts/test-component-update.mjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Commerce-validation-${{ runner.os }}
          path: |
            output/electron-tests/
            output/update-validation/
            release/desktop/
