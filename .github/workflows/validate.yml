name: Validate commerce desktop
on:
  pull_request:
  push:
    branches: ['codex/**', main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
defaults:
  run:
    shell: bash
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: 'native/sandbox -> target'
      - name: Install dependencies and prepare models
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci --ignore-scripts
          node node_modules/electron/install.js
          python -m backend.ocr_service
      - name: Source checks
        run: |
          python -m pytest -q
          npm test
          npm run build
          npm run build:sandbox
      - name: Build offline RPC plugin
        run: python scripts/build_backend.py --distpath resources/generated/plugins/official.labeledit/backend
      - name: Prepare and test actual sandboxed processes
        run: |
          npm run platform:prepare
          node scripts/verify-macos-runtime.mjs
          npm run test:platform
          npx playwright test --config tests/electron/playwright.config.mjs
      - name: Package Electron application (validation only)
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            npx electron-builder --dir --mac --arm64 --publish never --config electron-builder.yml -c.mac.identity=null -c.mac.notarize=false
            node scripts/verify-macos-runtime.mjs "release/desktop/mac-arm64/Commerce Tools.app"
          else
            npx electron-builder --dir --win --x64 --publish never --config electron-builder.yml
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Commerce-validation-${{ runner.os }}
          path: |
            output/electron-tests/
            release/desktop/
