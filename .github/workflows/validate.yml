name: Validate desktop
on:
  pull_request:
  push:
    branches: ['codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Install development dependencies
        shell: bash
        run: |
          python -m pip install -r requirements-dev.txt
          npm ci
      - name: Prepare offline models and test source
        shell: bash
        run: |
          python -m backend.ocr_service
          python -m pytest -q
          npm run test
          npm run build
          cargo check --manifest-path src-tauri/Cargo.toml
      - name: Build isolated backend
        run: python scripts/build_backend.py
      - name: Verify packaged backend offline
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            backend="src-tauri/resources/backend/label-edit-backend/label-edit-backend.exe"
          else
            backend="src-tauri/resources/backend/label-edit-backend/label-edit-backend"
          fi
          python scripts/smoke_backend.py --backend "$backend" --offline --report output/offline-smoke.json
      - name: Build desktop without publishing
        shell: bash
        run: CI=true npx tauri build --config '{"bundle":{"createUpdaterArtifacts":false}}'
      - uses: actions/upload-artifact@v4
        with:
          name: LabelEdit-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/nsis/*.exe
            output/offline-smoke.json
